name: Pearls weekly closure watchdog

on:
  schedule:
    # 07:30 Zurich in winter, 08:30 in summer. Both precede the next slot.
    - cron: '30 6 * * 2'
  workflow_dispatch:
    inputs:
      check_at:
        description: 'ISO timestamp with offset for a read-only replay'
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: pearls-weekly-closure-watchdog
  cancel-in-progress: false

jobs:
  check-closure:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/verification/weekly-live-checks-2026-11-18'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1e453070ae4c6cf8455924633854edbb09cf7eb4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const { checkWeeklyClosure } = await import(pathToFileURL(path.resolve('scripts/weekly-watchdog.mjs')).href);
            // Synthetic activation is confined to this probe client. The real ledger is untouched.
            const probeCycle = '2000-01-11';
            const synthetic = [{ id: 1, user: { login: context.repo.owner },
              created_at: '2000-01-11T00:00:00Z', updated_at: '2000-01-11T00:00:00Z',
              body: 'pearls-weekly ' + JSON.stringify({ type: 'activation', firstCycle: probeCycle }) }];
            let incident;
            const client = {
              paginate: async (endpoint, input) => {
                if (input.issue_number === 58) return synthetic;
                const listed = await github.paginate(endpoint, input);
                core.info('Listed issues: ' + JSON.stringify(listed.map(issue => ({ number: issue.number, hasMarker: issue.body?.includes('pearls-weekly-watchdog:2000-01-11'), isPr: !!issue.pull_request }))));
                return listed;
              },
              rest: { issues: { ...github.rest.issues,
                create: async (input) => {
                  const response = await github.rest.issues.create({ ...input,
                    title: '[Verification probe] ' + input.title,
                    body: input.body + '\\n\\nDisposable live watchdog test. Synthetic cycle only. Production is inactive.' });
                  incident = response.data.number;
                  return response;
                },
              } },
            };
            try {
              const args = { github: client, repo: context.repo, instant: new Date('2000-01-18T06:30:00Z') };
              const first = await checkWeeklyClosure(args);
              core.info('First result: ' + first);
              if (first.startsWith('incident already recorded')) {
                await core.summary.addRaw('Live duplicate detection passed against existing closed probe issues.').write();
                return;
              }
              if (!incident || first !== 'incident created in #' + incident) throw new Error('Creation failed');
              const second = await checkWeeklyClosure(args);
              if (second !== 'incident already recorded in #' + incident) throw new Error('Deduplication failed');
              const { data } = await github.rest.issues.get({ ...context.repo, issue_number: incident });
              if (!data.labels.some(label => label.name === 'publication-paused') ||
                  !data.assignees.some(user => user.login === context.repo.owner)) throw new Error('Delivery verification failed');
              await core.summary.addRaw('Live GITHUB_TOKEN issue creation, pause label, owner assignment and duplicate suppression passed. Probe issue #' + incident + '.').write();
            } finally {
              if (incident) await github.rest.issues.update({ ...context.repo, issue_number: incident, state: 'closed', state_reason: 'completed' });
            }
