name: Pearls weekly closure watchdog

on:
  schedule:
    # 07:30 Zurich in winter, 08:30 in summer. Both precede the next slot.
    - cron: '30 6 * * 2'
  workflow_dispatch:
    inputs:
      check_at:
        description: 'ISO timestamp with offset for a read-only replay'
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: pearls-weekly-closure-watchdog
  cancel-in-progress: false

jobs:
  check-closure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const { checkWeeklyClosure } = await import(pathToFileURL(path.resolve('scripts/weekly-watchdog.mjs')).href);
            const dryRun = context.eventName === 'workflow_dispatch';
            const value = context.payload.inputs?.check_at;
            if (dryRun && !/(?:Z|[+-]\d{2}:\d{2})$/.test(value ?? '')) {
              throw new Error('Replay requires a timestamp with a UTC offset');
            }
            const instant = dryRun ? new Date(value) : new Date();
            if (!Number.isFinite(instant.getTime())) throw new Error('Invalid replay timestamp');
            const result = await checkWeeklyClosure({ github, repo: context.repo, instant, dryRun });
            core.info(result);
            await core.summary.addRaw(result).write();
