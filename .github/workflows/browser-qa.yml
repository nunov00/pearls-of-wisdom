name: Browser QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/browser/**'
      - 'playwright.config.ts'
      - 'scripts/browser-runtime.mjs'
      - 'scripts/article-qa.mjs'
      - 'tests/browser-runtime.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-qa.yml'
permissions:
  contents: read
concurrency:
  group: browser-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Chromium comes from the exact npm package; retain WebKit coverage separately.
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      - run: npm run test:browser
      - name: Verify release metadata
        env:
          RELEASE: '1'
          SITE_URL: https://example.invalid
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/release
        run: |
          npm run build
          npm run test:browser -- --grep 'release metadata' --output=test-results/release
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: |
            playwright-report/
            test-results/
          retention-days: 3
