  "recommendations": [
    {
      "id": "retrieve",
      "heading": "Try from memory",
      "whatToDo": "After learning a small section, close your notes. Answer a question, explain the idea aloud or write what you remember. Then check your attempt.",
      "whyItMatters": "Practice testing can improve later recall; it is a learning activity as well as a check.",
      "consequence": "Relying only on rereading misses the opportunity to practise retrieving the answer.",
      "action": "Pick one idea from your next reading session. Turn it into a question and try answering with the page closed.",
      "details": "For example, after reading about evaporation, ask: “What happens to a liquid when it evaporates?” Give your own answer before looking. This is practice, not a judgement of your ability. If you draw a blank, use a cue or study a smaller part, then try again.",
      "claimIds": [
        "retrieve-benefit",
        "retrieve-consequence"
      ],
      "overview": {
        "heading": "Try from memory",
        "description": "Find out what you can bring back without looking.",
        "image": {
          "src": "/figures/study-recall.webp",
          "alt": "A learner writes in a notebook with her reference book closed."
        }
      }
    },
    {
      "id": "correct",
      "heading": "Check what you missed",
      "whatToDo": "Compare your attempt with a reliable source or worked answer. Correct missing or mistaken parts before you practise again.",
      "whyItMatters": "Corrective feedback makes retrieval practice more useful when your first answer is wrong.",
      "consequence": "An unchecked answer gives you no reliable way to identify what still needs work.",
      "action": "Choose one gap in your answer. Write the correction in your own words, then keep the question for another attempt.",
      "details": "In the evaporation example, “the liquid disappears” misses the change of state. A fuller answer is that the liquid changes into a gas. Check the explanation in your learning material rather than judging by how familiar your answer sounds. Feedback is part of recall practice, not a separate technique with an equal-sized benefit.",
      "claimIds": [
        "correct-benefit",
        "correct-consequence"
      ],
      "overview": {
        "heading": "Check what you missed",
        "description": "Turn a wrong or incomplete answer into useful practice.",
        "image": {
          "src": "/figures/study-check.webp",
          "alt": "The learner compares an open reference book with her notebook and adds a correction."
        }
      }
    },
    {
      "id": "space",
      "heading": "Come back later",
      "whatToDo": "Return to the same material in separate sessions. Try answering from memory again, then check, instead of doing all your practice in one sitting.",
      "whyItMatters": "Distributed practice generally supports longer-term retention better than cramming the same material together.",
      "consequence": "Cramming can help in the short term, but leaves less opportunity for durable retention.",
      "action": "Put the same question in your diary for tomorrow and again later in the week. Start those sessions with the page closed.",
      "details": "Use your evaporation question again and check whether your answer now includes the change into a gas. Tomorrow and later in the week are practical starting points, not an optimal formula. Useful gaps depend on the material and how long you need to remember it. If you have forgotten too much, shorten the gap or review a smaller part.",
