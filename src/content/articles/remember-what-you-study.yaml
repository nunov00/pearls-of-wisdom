      ]
    },
    {
      "id": "space",
      "heading": "Return on another day",
      "whatToDo": "Spread practice across separate sessions instead of putting all your revision into one long sitting.",
      "whyItMatters": "Distributed practice generally supports longer-term retention better than cramming the same material together.",
      "consequence": "Cramming can help in the short term, but leaves less opportunity for durable retention.",
      "action": "Book a short return to the same material tomorrow and another later in the week.",
      "details": "These timings are a practical starting point, not a scientifically optimal schedule. Useful gaps depend on the material and how long you need to remember it.",
