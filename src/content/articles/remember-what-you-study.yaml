      "id": "correct",
      "heading": "Check what you missed",
      "whatToDo": "Compare your attempt with a reliable source or worked answer. Correct missing or mistaken parts before you practise again.",
      "whyItMatters": "Checking and correcting a wrong answer can help you learn from the attempt.",
      "consequence": "An unchecked answer gives you no reliable way to identify what still needs work.",
      "action": "Choose one gap in your answer. Write the correction in your own words, then keep the question for another attempt.",
      "details": "In the Spanish example, compare your attempt with the answer: “gracias”. If you forgot part of the word or mixed it up, write the correct version and try it again later. Check your learning material rather than judging by how familiar your answer sounds. Checking belongs with the memory practice; the steps work together.",
