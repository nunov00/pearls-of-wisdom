      "consequence": "Relying only on rereading misses the opportunity to practise retrieving the answer.",
      "action": "Turn one heading from your notes into a question and answer it with the page closed.",
      "details": "Keep questions manageable. If you cannot recall anything, use a cue or review a smaller section, then try again.",
