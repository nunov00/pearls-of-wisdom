  ],
  "goal": "Reduce vulnerability to everyday financial shocks",
  "audience": "For anyone managing money, from a first wage to household bills, or helping someone else. The borrowing guidance concerns adults; agreements, support and legal protections depend on local rules.",
  "assumptions": "General education drawn from US and UK public guidance. Debt priorities, support services and account protections depend on your country; this is not individual financial advice.",
  "introduction": "An unexpected repair can become two problems: the bill itself and the borrowing needed to pay it. Seeing what is due, keeping a reserve when possible and reducing costly debt can give you more room to respond.",
  "publishedAt": "2026-10-19",
  "revisedAt": "2026-10-31",
  "lastEvidenceCheckedAt": "2026-10-27",
  "selection": {
    "basis": "foundations",
    "rationale": "These foundations address three different pressures: payment timing, unexpected expenses and borrowing costs. They are starting points, not a measured ranking or a fixed order for allocating money. Whether to save or repay extra debt depends on the household situation.",
    "alternatives": [
      {
        "candidate": "Investing",
        "reason": "Longer-term goal; does not replace accessible emergency money."
      },
      {
        "candidate": "Insurance",
        "reason": "Potentially essential for major risks, but suitability is jurisdiction- and circumstance-dependent; not excluded from a complete financial plan."
      }
    ]
