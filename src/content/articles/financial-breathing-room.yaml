      "id": "cash-flow",
      "heading": "Know what is coming in and going out",
      "whatToDo": "List your income, essential bills and their due dates. Compare the timing, not just the monthly total.",
      "whyItMatters": "Tracking cash flow can reveal a shortfall before a payment is due and help you plan around it.",
      "consequence": "A monthly budget can still leave you short if bills arrive before your income.",
      "action": "Put your next income date and the next three essential bills on one calendar.",
      "details": "Changing a due date may help in some cases, but agreement depends on the provider. Tracking alone cannot resolve insufficient income.",
      "claimIds": [
        "cash-flow-benefit",
        "cash-flow-consequence"
      ]
    },
    {
      "id": "buffer",
      "heading": "Build a buffer you can actually use",
      "whatToDo": "If you can, put aside a manageable amount in a safe, accessible place for unexpected expenses. Choose a first target that fits your situation.",
      "whyItMatters": "Emergency savings can reduce the need to borrow when an unexpected bill arrives.",
      "consequence": "Without a reserve, an unexpected expense may become debt with interest and fees.",
      "action": "Choose one common surprise bill and set a small first savings target towards it.",
      "details": "There is no universal correct amount. A recurring transfer may help if your balance can support it; avoid causing overdraft charges.",
      "claimIds": [
        "buffer-benefit",
        "buffer-consequence"
      ]
    },
    {
      "id": "debt",
      "heading": "Tackle costly debt after protecting essentials",
      "whatToDo": "Keep essential payments and required minimums in view. Where spare money is available, compare interest rates before choosing which ordinary unsecured debt to reduce first.",
      "whyItMatters": "Paying down the highest-interest debt first can save interest compared with starting with a cheaper debt.",
      "consequence": "Leaving expensive borrowing outstanding can mean paying more interest over time.",
      "action": "Write down the balance, interest rate and minimum payment for each debt.",
      "details": "Interest is not the only priority. Local law and the consequences of missing housing, utilities or secured-debt payments can change the order. The smallest-balance method may be more motivating, but can cost more interest.",
      "claimIds": [
        "debt-benefit",
        "debt-consequence"
      ],
      "safety": "If you cannot meet essential bills or are in arrears, seek reputable local debt advice before choosing a repayment order."
