  "slug": "financial-breathing-room",
  "title": "Give your money more breathing room",
  "description": "See what is due, keep something in reserve and tackle debt with essentials protected first.",
  "category": "Finance",
  "keywords": [
    "money",
    "savings",
    "debt",
    "emergency fund",
