        }
      }
    },
    {
      "id": "buffer",
      "heading": "Keep a little in reserve",
      "whatToDo": "If you can afford to save, set aside a manageable amount for unexpected expenses in a safe place you can access when needed. Keep money for routine bills separate.",
      "whyItMatters": "A reserve can help cover an unexpected bill without borrowing for the whole amount.",
      "consequence": "An unexpected expense paid with credit can grow through interest and fees.",
      "action": "Think of one unexpected cost you have faced, such as a repair. Choose a first savings target towards it and an amount you can set aside without missing essentials or required debt payments.",
      "details": "In the repair example: the reserve pays some or all of the bill. That is what it is for; rebuild it when you can.\n\nThere is no single right target for everyone. If you automate savings, check the timing and balance so the transfer does not cause an overdraft. Check account fees, withdrawal rules and local protection if the provider fails.",
      "claimIds": [
        "buffer-benefit",
        "buffer-consequence"
      ],
      "overview": {
        "heading": "Keep a little in reserve",
        "description": "Give unexpected costs somewhere to land.",
        "image": {
          "src": "/figures/finance-buffer-v2.webp",
          "alt": "An adult puts a coin into a jar holding a modest reserve."
        }
      }
    },
    {
      "id": "debt",
      "heading": "Reduce borrowing costs",
      "whatToDo": "Protect food, housing and other essentials. Give priority to bills with serious consequences if missed, such as energy bills or court fines; the order depends on local rules. Keep up the minimum payments required by your lenders before making extra repayments. If money remains, paying extra towards the highest-interest unsecured debt can reduce interest costs. Unsecured borrowing is not backed by a specific asset such as your home or car.",
      "whyItMatters": "With priority payments protected, paying extra towards higher-interest debt can save interest compared with starting with cheaper debt.",
      "consequence": "Leaving expensive borrowing outstanding can mean paying more interest over time.",
      "action": "List each debt, its balance, interest rate and minimum payment. Flag overdue amounts and any payments with serious consequences if missed before choosing where extra money goes.",
      "details": "In the repair example: if the bill has gone on a credit card, compare its rate with your other borrowing after protecting essential payments.\n\nCheck fees, early-repayment charges and changing rates too. Starting with the smallest balance may feel more rewarding, but can cost more interest. Saving and extra repayments compete for spare money; you do not have to finish building a reserve before tackling debt.",
      "claimIds": [
        "debt-benefit",
        "debt-consequence",
        "debt-priority-qualification",
        "debt-terms-qualification",
        "support-qualification",
        "us-support-qualification"
      ],
      "safety": "If you are behind or cannot cover essentials and required debt payments, seek independent local debt advice before choosing repayment amounts. Seek urgent advice if your home, essential services or a court deadline is at risk.\n\nIn the UK, MoneyHelper offers a free Debt Advice Locator. In the US, the CFPB explains how to find and check a non-profit credit counsellor. Ask about fees: non-profit does not always mean free. Readers elsewhere should check local public advice services.",
      "overview": {
