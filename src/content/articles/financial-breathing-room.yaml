  "recommendations": [
    {
      "id": "cash-flow",
      "heading": "See what is due",
      "whatToDo": "Put income dates, essential spending and bill due dates in one place. Check what must be paid before the next money comes in, including the minimum payment required on any debt.",
      "whyItMatters": "Seeing payment dates together can help you spot a gap before a bill is due.",
      "consequence": "A month can balance on paper while you still run short between income dates.",
      "action": "Mark your next income date and the next three payments you need to make. Add the amounts and check what will be left after paying them.",
      "details": "In the repair example: the bill arrives before payday. Your calendar shows which bills already need the money in your account.\n\nStarting with your first wage? Include a phone bill, travel costs or a subscription renewal, even if you do not run a household.\n\nYou can ask a provider about changing a due date, but they must agree. If income cannot cover essentials, tracking alone will not fix the gap: ask a local public advice service about benefits, emergency help or payment support. In the UK, MoneyHelper can connect you with free debt advice and help checking entitlements.",
      "claimIds": [
        "cash-flow-benefit",
