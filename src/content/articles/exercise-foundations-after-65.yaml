  "recommendations": [
    {
      "id": "move",
      "heading": "Move a little more briskly",
      "whatToDo": "Build towards 150–300 minutes of moderate activity each week, such as brisk walking, cycling or wheeling. At a moderate effort, you can talk but not sing. Short bouts count.",
      "whyItMatters": "Regular physical activity supports cardiovascular health and physical function.",
      "consequence": "Doing little activity means missing some of those benefits; it does not make illness inevitable.",
      "action": "Put a ten-minute walk, wheel or suitable alternative in your diary. Choose a pace that suits your current ability.",
      "details": "Vigorous activity or a mixture is another option. The weekly target is something to build towards, not an entry requirement. Choose an activity you can do safely.",
      "claimIds": [
        "move-benefit",
        "move-consequence"
      ],
      "overview": {
        "heading": "Keep moving",
        "description": "Build endurance for everyday activities.",
        "image": {
          "src": "/figures/exercise-moving.webp",
          "alt": "Illustration of an older woman walking purposefully."
        }
      }
    },
    {
      "id": "strength",
      "heading": "Give your muscles a challenge",
      "whatToDo": "Include strengthening on at least two days each week, covering the major muscle groups. Weights, resistance bands and suitable body-weight exercises can all count.",
      "whyItMatters": "Stronger muscles help with everyday activities and independence.",
      "consequence": "Walking alone does not fulfil the separate strengthening recommendation.",
      "action": "Choose two days for strength work. If you are new to it, book an introductory session and ask for a short routine you can repeat.",
      "details": "Choose resistance suited to your ability and keep the movement controlled. An introductory session can help you choose a starting level. Walking is useful, but your routine also needs deliberate strengthening.",
      "claimIds": [
        "strength-benefit",
        "strength-consequence",
        "strength-practice"
      ],
      "overview": {
        "heading": "Build strength",
        "description": "Make lifting, carrying and getting up easier.",
        "image": {
          "src": "/figures/exercise-strength.webp",
          "alt": "Illustration of an older man carrying shopping bags."
        }
      }
    },
    {
      "id": "balance",
      "heading": "Make room for balance",
      "whatToDo": "Include varied activity that challenges balance and builds strength at an effort suited to your ability. WHO recommends multicomponent activity emphasising balance and strength at moderate or greater intensity on at least three days a week.",
      "whyItMatters": "Balance-focused activity helps reduce falls.",
      "consequence": "Leaving it out misses a specific part of fall prevention, even if you already walk regularly.",
      "action": "Find a balance class or ask a qualified professional for a home routine suited to you.",
      "details": "Some activities combine endurance, strength and balance. Judge what the activity involves rather than assuming that every class covers all three.",
      "claimIds": [
        "balance-benefit",
        "balance-consequence"
      ],
      "safety": "If you feel unsteady, get support. Ask for a supervised or professionally guided routine rather than practising unsupported.",
