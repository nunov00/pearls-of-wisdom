  "goal": "Maintain physical capacity through exercise",
  "audience": "Adults aged 65 and over; adapt activity to your abilities and conditions.",
  "assumptions": "General exercise guidance, not a complete plan for healthy ageing.",
  "introduction": "Getting out of a chair, carrying shopping and walking to the bus draw on different abilities. A useful exercise routine keeps more than one of them in practice.",
