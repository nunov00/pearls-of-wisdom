  "recommendations": [
    {
      "id": "move",
      "heading": "Move at a pace that makes you breathe harder",
      "whatToDo": "Build towards 150–300 minutes of moderate activity each week, such as brisk walking or cycling. At a moderate effort, you can talk but not sing. Shorter bouts count.",
      "whyItMatters": "Regular physical activity supports cardiovascular health and physical function.",
      "consequence": "Doing little activity means missing some of those benefits; it does not make illness inevitable.",
      "action": "Put a ten-minute walk, wheel or suitable alternative in your diary.",
      "details": "Vigorous activity or a mixture is another option. The weekly target is something to build towards, not an entry requirement. Choose an activity you can do safely.",
      "claimIds": [
        "move-benefit",
        "move-consequence"
      ]
    },
    {
      "id": "strength",
      "heading": "Give your muscles something to work against",
      "whatToDo": "Include strengthening on at least two days each week, covering the major muscle groups. Choose resistance that makes the final repetitions challenging while you keep control, adjusted to your ability.",
      "whyItMatters": "Stronger muscles help with everyday activities and independence.",
      "consequence": "Walking alone does not fulfil the separate strengthening recommendation.",
      "action": "Choose two days for a short strength session. If you are unsure how to begin, arrange an introductory session with a qualified instructor.",
      "details": "Weights, resistance bands and suitable body-weight exercises can all count. A walk may work your muscles, but an exercise routine still needs deliberate strengthening. You do not need to push to the point where you cannot complete another repetition.",
      "claimIds": [
        "strength-benefit",
        "strength-consequence"
      ]
    },
    {
      "id": "balance",
      "heading": "Practise balance as well as endurance",
      "whatToDo": "Include activities that challenge balance safely. WHO recommends varied activity emphasising balance and strength on at least three days a week for older adults.",
      "whyItMatters": "Balance-focused activity helps reduce falls.",
      "consequence": "Leaving it out misses a specific part of fall prevention, even if you already walk regularly.",
      "action": "Find a suitable balance class or a professionally guided home routine.",
      "details": "Some activities combine endurance, strength and balance. Judge what the activity involves rather than assuming that every class covers all three.",
      "claimIds": [
        "balance-benefit",
        "balance-consequence"
      ],
      "safety": "If you are unsteady, seek support rather than practising unsupported."
    }
  ],
